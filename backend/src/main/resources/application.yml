spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fashion_catalog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      indent-output: true

server:
  port: 8080

ratelimit:
  admin:
    capacity: 20
    refill-tokens: 20
    refill-duration-minutes: 5
  public:
    capacity: 100
    refill-tokens: 100
    refill-duration-minutes: 1
  progressive-block:
    initial-block-seconds: 60
    multiplier: 5
    max-block-hours: 24
    violation-window-hours: 2

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  notification:
    whatsapp-token: ${WHATSAPP_TOKEN:}
    whatsapp-phone: ${WHATSAPP_PHONE:}
    admin-email: ${ADMIN_EMAIL:admin@tienda.com}
