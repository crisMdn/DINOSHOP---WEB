<template id="scene1-intro-template">
  <div data-composition-id="scene1-intro" data-width="1920" data-height="1080">
    <style>
      [data-composition-id="scene1-intro"] {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      }
      [data-composition-id="scene1-intro"] .logo {
        font-family: "Playfair Display", serif;
        font-size: 120px;
        font-weight: 700;
        color: #e94560;
        letter-spacing: 8px;
        text-transform: uppercase;
      }
      [data-composition-id="scene1-intro"] .tagline {
        font-family: "Montserrat", sans-serif;
        font-size: 32px;
        font-weight: 300;
        color: #ffffff;
        letter-spacing: 12px;
        margin-top: 20px;
        text-transform: uppercase;
      }
      [data-composition-id="scene1-intro"] .decoration-line {
        width: 200px;
        height: 4px;
        background: linear-gradient(90deg, transparent, #e94560, transparent);
        margin: 40px 0;
      }
    </style>
    <div class="scene-content">
      <div class="logo">FASHION</div>
      <div class="decoration-line"></div>
      <div class="tagline">Tu estilo, tu momento</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from(".logo", { y: 60, opacity: 0, duration: 1, ease: "power3.out" }, 0.2);
      tl.from(".decoration-line", { scaleX: 0, opacity: 0, duration: 0.8, ease: "power2.out" }, 0.8);
      tl.from(".tagline", { y: 30, opacity: 0, duration: 0.8, ease: "power2.out" }, 1.2);

      window.__timelines["scene1-intro"] = tl;
    </script>
  </div>
</template>
