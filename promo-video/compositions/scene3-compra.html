<template id="scene3-compra-template">
  <div data-composition-id="scene3-compra" data-width="1920" data-height="1080">
    <style>
      [data-composition-id="scene3-compra"] {
        background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
      }
      [data-composition-id="scene3-compra"] .title {
        font-family: "Playfair Display", serif;
        font-size: 72px;
        font-weight: 700;
        color: #ffffff;
        text-align: center;
      }
      [data-composition-id="scene3-compra"] .subtitle {
        font-family: "Montserrat", sans-serif;
        font-size: 28px;
        font-weight: 300;
        color: #e94560;
        letter-spacing: 4px;
        margin-bottom: 50px;
      }
      [data-composition-id="scene3-compra"] .steps {
        display: flex;
        gap: 60px;
        justify-content: center;
        align-items: center;
      }
      [data-composition-id="scene3-compra"] .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      [data-composition-id="scene3-compra"] .step-number {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #e94560, #ff6b6b);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Montserrat", sans-serif;
        font-size: 36px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
      }
      [data-composition-id="scene3-compra"] .step-text {
        font-family: "Montserrat", sans-serif;
        font-size: 22px;
        color: #ffffff;
        font-weight: 500;
      }
      [data-composition-id="scene3-compra"] .arrow {
        font-size: 40px;
        color: #e94560;
      }
    </style>
    <div class="scene-content">
      <div class="subtitle">SIMPLE</div>
      <div class="title">Compra en un Clic</div>
      <div class="steps">
        <div class="step">
          <div class="step-number">1</div>
          <div class="step-text">Elige</div>
        </div>
        <div class="arrow">→</div>
        <div class="step">
          <div class="step-number">2</div>
          <div class="step-text">Paga</div>
        </div>
        <div class="arrow">→</div>
        <div class="step">
          <div class="step-number">3</div>
          <div class="step-text">Recibe</div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from(".subtitle", { y: 30, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.from(".title", { y: 40, opacity: 0, duration: 0.8, ease: "power3.out" }, 0.4);
      tl.from(".step", { y: 50, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.6);
      tl.from(".arrow", { opacity: 0, duration: 0.4 }, 1);

      window.__timelines["scene3-compra"] = tl;
    </script>
  </div>
</template>
