<template id="scene4-promos-template">
  <div data-composition-id="scene4-promos" data-width="1920" data-height="1080">
    <style>
      [data-composition-id="scene4-promos"] {
        background: linear-gradient(135deg, #e94560 0%, #1a1a2e 50%, #0f3460 100%);
      }
      [data-composition-id="scene4-promos"] .badge {
        font-family: "Montserrat", sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
        background: linear-gradient(135deg, #ff6b6b, #e94560);
        padding: 12px 30px;
        border-radius: 50px;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 4px;
      }
      [data-composition-id="scene4-promos"] .title {
        font-family: "Playfair Display", serif;
        font-size: 80px;
        font-weight: 700;
        color: #ffffff;
        text-align: center;
      }
      [data-composition-id="scene4-promos"] .discount {
        font-family: "Montserrat", sans-serif;
        font-size: 100px;
        font-weight: 700;
        color: #ffd700;
        text-shadow: 0 10px 40px rgba(255, 215, 0, 0.5);
        margin: 30px 0;
      }
      [data-composition-id="scene4-promos"] .subtitle {
        font-family: "Montserrat", sans-serif;
        font-size: 28px;
        font-weight: 400;
        color: #ffffff;
        opacity: 0.9;
      }
    </style>
    <div class="scene-content">
      <div class="badge">Solo Online</div>
      <div class="title">Promociones Exclusivas</div>
      <div class="discount">HASTA 50%</div>
      <div class="subtitle">Descuentos que no encontrarás en tienda</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from(".badge", { y: -30, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.from(".title", { y: 40, opacity: 0, duration: 0.8, ease: "power3.out" }, 0.5);
      tl.from(".discount", { scale: 0.5, opacity: 0, duration: 1, ease: "elastic.out(1, 0.5)" }, 0.8);
      tl.from(".subtitle", { y: 30, opacity: 0, duration: 0.6, ease: "power2.out" }, 1.2);

      window.__timelines["scene4-promos"] = tl;
    </script>
  </div>
</template>
